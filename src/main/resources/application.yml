spring:
  application:
    name: med-clinic
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/medclinic;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  thymeleaf:
    cache: true
server:
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}
clinic:
  zone: ${CLINIC_ZONE:America/Cuiaba}
  reception-password: ${RECEPTION_PASSWORD:}
  manager-password: ${MANAGER_PASSWORD:}
  doctor-password: ${DOCTOR_PASSWORD:}
  files: ${CLINIC_FILES:./data/files}
  clam-host: ${CLAM_HOST:localhost}
  clam-port: ${CLAM_PORT:3310}
